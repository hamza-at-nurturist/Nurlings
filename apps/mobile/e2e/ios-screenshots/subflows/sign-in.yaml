appId: com.nurturistai.nurlings
---
- runFlow: launch-app.yaml
- runFlow:
    when:
      visible: "Sign up for Nurlings"
    commands:
      - tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Sign in to Nurlings"
    timeout: 15000
- tapOn: "Email"
- inputText: ${RAKAZO_ACTIVE_EMAIL}
- tapOn: "Password"
- inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "Don’t allow"
    optional: true
- tapOn:
    text: "Don't allow"
    optional: true
# A new account answers the signup survey before the inbox.
- extendedWaitUntil:
    visible: "Account|.*How did you hear about us.*"
    timeout: 40000
