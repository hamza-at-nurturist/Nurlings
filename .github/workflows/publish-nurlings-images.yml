name: publish-nurlings-images

# Publishes the Nurlings server images (amd64 only) to ghcr.io/<org>/nurlings/<image>. Every
# segment of an image reference is lowercase. Main publishes `edge`; `v*` tags publish semver tags
# (and `latest` for stable ones); a manual run from any ref publishes the `sha-<commit>` tag.
# The upstream publish-server-image.yml only runs in elie222/rakazo.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # docker/metadata-action otherwise truncates commit tags to seven collision-prone characters.
  DOCKER_METADATA_SHORT_SHA_LENGTH: 40

concurrency:
  group: publish-nurlings-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: infra/compose/Dockerfile
            context: .
          - name: updater
            dockerfile: infra/updater/Dockerfile
            context: .
          - name: computer
            dockerfile: infra/sandboxes/computer/Dockerfile
            context: infra/sandboxes/computer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Lowercase the image namespace
        id: namespace
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/nurlings/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.namespace.outputs.image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            # Stable releases only: a hyphen marks a prerelease (v1.0.0-rc.1) that must not move latest.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GET /health can report the exact source commit without a deployment-supplied override.
          build-args: ${{ matrix.name == 'app' && format('GIT_SHA={0}', github.sha) || '' }}
          cache-from: type=gha,scope=nurlings-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=nurlings-${{ matrix.name }}
          provenance: false
          sbom: false
