<svg class="nl-intro" xmlns="http://www.w3.org/2000/svg" viewBox="200 520 1660 960" role="img" aria-label="Nurlings">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#4FFFDB"/><stop offset=".5" stop-color="#6AAEF6"/><stop offset="1" stop-color="#8F7AFB"/>
<animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="12s" repeatCount="indefinite"/>
</linearGradient>
<style>
.nl-intro .b,.nl-intro .be,.nl-intro .o,.nl-intro .e{transform-box:fill-box}
.nl-intro .b{transform-origin:50% 100%;animation:in-b .9s cubic-bezier(.22,1,.36,1) both, breathe 6s ease-in-out 1.7s infinite}
.nl-intro .o{transform-origin:50% 50%;animation:in-o 1.1s cubic-bezier(.65,0,.35,1) .45s both, drift 6s ease-in-out 1.7s infinite}
.nl-intro .be{animation:track 6s ease-in-out 1.7s infinite}
.nl-intro .e{transform-origin:50% 50%;animation:open .3s cubic-bezier(.22,1,.36,1) .55s both, blink 6s ease-in-out 1.7s infinite}
.nl-intro .oe .e{animation:open .3s cubic-bezier(.22,1,.36,1) 1.35s both, blink 6s ease-in-out calc(1.7s + .12s) infinite}
@keyframes in-b{0%{transform:translateY(40px) scale(.86);opacity:0}100%{transform:none;opacity:1}}
@keyframes in-o{0%{transform:translate(-330px,260px) scale(.2);opacity:0}45%{opacity:1}70%{transform:translate(-60px,-70px) scale(1.04)}100%{transform:none;opacity:1}}
@keyframes open{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.985)}}
@keyframes drift{0%,100%{transform:translate(0,0)}30%{transform:translate(-18px,-30px)}62%{transform:translate(14px,-42px)}82%{transform:translate(6px,-10px)}}
@keyframes track{0%,100%{transform:translate(0,0)}30%{transform:translate(10px,-4px)}62%{transform:translate(22px,-8px)}82%{transform:translate(16px,-2px)}}
@keyframes blink{0%,40%,46%,100%{transform:scaleY(1)}43%{transform:scaleY(.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
