<g class="be" fill="var(--nurlings-eye, #03091F)"><path class="e" d="M901.7 802.3L875.8 909.9A32.6 32.6 0 0 0 939.2 925.2L965.2 817.7A32.6 32.6 0 0 0 901.7 802.3Z"/><path class="e" d="M1040.8 833.9L1014.7 941.5A32.7 32.7 0 0 0 1078.3 956.9L1104.3 849.3A32.7 32.7 0 0 0 1040.8 833.9Z"/></g></g>
<g class="o"><circle cx="1591.3" cy="846.5" r="190.6" fill="url(#g)"/>
