  # Models
  PI_DEFAULT_PROVIDER:
  PI_DEFAULT_MODEL:
  PI_DEFAULT_CREDENTIALS:
  PI_SESSION_RECORDING:
  RAKAZO_LIVE_MODEL_CATALOG:
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
