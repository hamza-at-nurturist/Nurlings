# Coolify v4 deployment of one dedicated Nurlings client server.
# Add Resource -> Docker Compose Empty -> paste this file. Runbook: deploy/coolify/README.md
#
# The routing variable SERVICE_FQDN_WEB_5173 carries the container port; the app settings use the
# port-free SERVICE_URL_WEB / SERVICE_FQDN_WEB that Coolify derives from the same domain.
#
# Set NURLINGS_VERSION (a release tag such as v0.1.0, never latest or edge) and give the `web`
# service its domain. Coolify generates every secret below (SERVICE_PASSWORD_*): back up
# ENCRYPTION_KEY from the resource's variables. Everything else is optional.
#
# No `ports:`: Coolify's proxy routes the `web` domain to port 5173. The service is named `web`
# and nothing sets `container_name`, because the supervisor finds `web` by its Compose project and
# service labels to attach it to each bot computer's isolated network.
# Only `supervisor` mounts the Docker socket.
#
# Keep in sync with infra/compose/docker-compose.images.yml: infra/updater/src/compose-env.test.ts
# fails when a read is missing here or a key is unused, and coolify-compose.test.ts guards the rest.
# A key shown as `KEY: ${KEY:-}` is an editable Coolify variable; a bare `KEY:` is passed through
# only when set and is not shown in Coolify's variable list.

x-app-environment: &app-environment
  # Runtime
  NODE_ENV: production
  # The app's own login, subject to row-level security (docs/self-host.md#database-roles).
  DATABASE_URL: postgres://rakazo_app:${SERVICE_PASSWORD_APPDB}@postgres:5432/${POSTGRES_DB:-nurlings}
