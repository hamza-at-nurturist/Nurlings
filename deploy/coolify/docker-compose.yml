  BROWSER_PROVIDER:
  E2B_API_KEY:
  DAYTONA_API_KEY:
  DAYTONA_API_URL:
  DAYTONA_TARGET:
  DAYTONA_SNAPSHOT:
  BOAT_API_KEY:
  BOAT_API_URL:
  BOX_API_KEY:
  BOX_API_URL:
  BOX_BASE_URL:
  RAILWAY_API_TOKEN:
  RAILWAY_ENVIRONMENT_ID:
  RAILWAY_SANDBOX_REGION:
  RAILWAY_MAX_WORKSPACE_FILE_BYTES:
  CREATEOS_SANDBOX_API_KEY:
  CREATEOS_SANDBOX_BASE_URL:
  CREATEOS_SANDBOX_ROOTFS:
  CREATEOS_SANDBOX_SHAPE:
  CLOUD_AGENT_PROVIDER: ${CLOUD_AGENT_PROVIDER:-none}
  CLOUD_AGENT_SPACE_ID: ${CLOUD_AGENT_SPACE_ID:-}
  CURSOR_API_KEY: ${CURSOR_API_KEY:-}
  # Tools and integrations
  WEB_PROVIDER:
  KEENABLE_API_KEY:
  COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
  PIPEDREAM_CLIENT_ID:
  PIPEDREAM_CLIENT_SECRET:
  PIPEDREAM_PROJECT_ID:
  PIPEDREAM_ENVIRONMENT:
  MCP_STDIO_ENABLED:
  MCP_STDIO_ALLOWED_COMMANDS:
  MCP_STDIO_INSTALL_TIMEOUT_MS:
  MCP_STDIO_STARTUP_TIMEOUT_MS:
  MCP_STDIO_IDLE_MS:
  MCP_DISCOVERY_TIMEOUT_MS:
