  # Back this value up offline: encrypted content and backups cannot be read without it.
  ENCRYPTION_KEY: ${SERVICE_PASSWORD_64_CRYPT}
  ENCRYPTION_MASTER_KEYS: ${ENCRYPTION_MASTER_KEYS:-}
  # on encrypts new content at rest; off stores it readable (docs/self-host.md#content-encryption).
  CONTENT_ENCRYPTION: ${CONTENT_ENCRYPTION:-on}
  WAKEUP_DRIVER: graphile
  AGENT_RUNTIME: pi
  API_URL: ${SERVICE_URL_WEB}
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
  RAKAZO_IMAGE_TAG: ${NURLINGS_VERSION:?Set NURLINGS_VERSION to a release tag such as v0.1.0}
