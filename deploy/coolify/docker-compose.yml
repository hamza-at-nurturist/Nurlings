services:
  postgres:
    image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 2g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nurlings}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-nurlings}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Pull-only stub so the stack fetches the bot computer image from our registry with everything
  # else. Runs once and exits.
  computer:
    image: ghcr.io/hamza-at-nurturist/nurlings/computer:${NURLINGS_VERSION:?Set NURLINGS_VERSION to a release tag such as v0.1.0}
    command: ["true"]
    network_mode: none
    restart: "no"

  # Gives the app user ownership of the data volume, then exits.
  data-init:
    image: busybox:1
    command: ["chown", "-R", "1000:1000", "/data"]
    network_mode: none
    restart: "no"
    volumes:
      - appdata:/data

  # Starts and stops bot computers. Access to it is equivalent to control of the Docker host, so it
  # is the only service with the Docker socket and its port is never published.
  supervisor:
    image: ghcr.io/hamza-at-nurturist/nurlings/app:${NURLINGS_VERSION:?Set NURLINGS_VERSION to a release tag such as v0.1.0}
    restart: unless-stopped
    command: ["pnpm", "--filter", "@rakazo/sandbox-supervisor", "start"]
    init: true
    user: root
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    environment:
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      NODE_ENV: production
      DATA_DIR: /data
      SUPERVISOR_HOST: "0.0.0.0"
      SUPERVISOR_PORT: "7091"
      DOCKER_SOCKET: /var/run/docker.sock
      RAKAZO_COMPUTER_IMAGE: ghcr.io/hamza-at-nurturist/nurlings/computer:${NURLINGS_VERSION:?Set NURLINGS_VERSION to a release tag such as v0.1.0}
      RAKAZO_COMPUTER_MEMORY: ${RAKAZO_COMPUTER_MEMORY:-2g}
      RAKAZO_COMPUTER_CPUS: ${RAKAZO_COMPUTER_CPUS:-2}
      RAKAZO_COMPUTER_PIDS_LIMIT: ${RAKAZO_COMPUTER_PIDS_LIMIT:-2048}
      SANDBOX_COMMAND_TIMEOUT_MS: ${SANDBOX_COMMAND_TIMEOUT_MS:-300000}
      SANDBOX_SUPERVISOR_TOKEN: ${SERVICE_PASSWORD_64_SUPERVISOR}
      SANDBOX_SCREEN_NETWORK: isolated
      # Mandatory on shared servers: bot computers get public-internet egress only. The supervisor
      # refuses to start a computer until the host rules from restrict-computer-egress.sh are
      # installed (README step 2). Bots then cannot reach the Coolify dashboard, the host or the LAN.
      SANDBOX_COMPUTER_EGRESS: ${SANDBOX_COMPUTER_EGRESS:-restricted}
      # Public resolvers, because restricted egress blocks a private host resolver.
      SANDBOX_COMPUTER_DNS: ${SANDBOX_COMPUTER_DNS:-1.1.1.1,1.0.0.1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-}
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-}
      AXIOM_EDGE: ${AXIOM_EDGE:-}
      AXIOM_EDGE_URL: ${AXIOM_EDGE_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appdata:/data
    networks:
      - app
    depends_on:
      computer:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:7091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    image: ghcr.io/hamza-at-nurturist/nurlings/app:${NURLINGS_VERSION:?Set NURLINGS_VERSION to a release tag such as v0.1.0}
    restart: unless-stopped
    # Node runs directly, not through pnpm, so a stop reaches it and in-flight work finishes.
    working_dir: /app/apps/api
    # Migrations run before the API serves, on every start.
    command:
      - bash
      - -lc
      - pnpm db:deploy && exec env -u DATABASE_MIGRATION_URL node --enable-source-maps dist/index.js
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m
    environment:
      <<: *app-environment
      # Owner login for migrations; the start command drops it before serving.
      DATABASE_MIGRATION_URL: postgres://${POSTGRES_USER:-nurlings}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-nurlings}
      API_HOST: "0.0.0.0"
      API_PORT:
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      BETTER_AUTH_URL: ${SERVICE_URL_WEB}
      WEB_ORIGIN: ${SERVICE_URL_WEB}
      AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-true}
      AUTH_BREACHED_PASSWORD_CHECK_ENABLED: ${AUTH_BREACHED_PASSWORD_CHECK_ENABLED:-false}
      PASSKEY_APPLE_APP_IDS: ${PASSKEY_APPLE_APP_IDS:-}
      PASSKEY_ANDROID_CERT_SHA256: ${PASSKEY_ANDROID_CERT_SHA256:-}
      TRUSTED_PROXIES:
      CLIENT_IP_HEADER:
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_ALLOW_SIGNUP_BYPASS: ${OIDC_ALLOW_SIGNUP_BYPASS:-false}
      SIGNUPS_ENABLED: ${SIGNUPS_ENABLED:-true}
      SIGNUP_ALLOWLIST: ${SIGNUP_ALLOWLIST:-}
      SCREEN_PROXY_SECRET: ${SERVICE_PASSWORD_64_SCREEN}
      RAKAZO_DESKTOP_STACK_TOKEN:
      RAKAZO_UPDATER_URL:
      RAKAZO_UPDATER_TOKEN:
      RAKAZO_GIT_SHA:
      SENTRY_BROWSER_DSN: ${SENTRY_BROWSER_DSN:-}
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      STRIPE_SECRET_KEY:
      STRIPE_WEBHOOK_SECRET:
      STRIPE_PRICE_ID:
      INTEGRATIONS_CATALOG_URL:
      TEAM_CHAT_BOT_ID:
      SLACK_RAKAZO_BOT_ID:
      TEAM_CHAT_JUDGE_PROVIDER:
      TEAM_CHAT_JUDGE_MODEL:
      SPACE_TEARDOWN_TIMEOUT_MS:
      RAKAZO_MIN_CLIENT_BUILD:
    volumes:
      - appdata:/data
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      supervisor:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 2m

  worker:
    image: ghcr.io/hamza-at-nurturist/nurlings/app:${NURLINGS_VERSION:?Set NURLINGS_VERSION to a release tag such as v0.1.0}
    restart: unless-stopped
    working_dir: /app/apps/worker
    command: ["node", "--enable-source-maps", "dist/index.js"]
    healthcheck:
      test: ["CMD", "node", "dist/health-check.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 2g
    environment:
      <<: *app-environment
      GRAPHILE_WORKER_CONCURRENCY:
    volumes:
      - appdata:/data
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      supervisor:
        condition: service_healthy
      api:
        condition: service_healthy

  # The only service with a public domain. Coolify routes it to port 5173 and proxies /rpc and
  # screen traffic to the API, so the API itself is never exposed.
  web:
    image: ghcr.io/hamza-at-nurturist/nurlings/app:${NURLINGS_VERSION:?Set NURLINGS_VERSION to a release tag such as v0.1.0}
    restart: unless-stopped
    working_dir: /app/apps/web
    command: ["node_modules/.bin/vite", "preview", "--host", "0.0.0.0", "--port", "5173"]
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    environment:
      - SERVICE_FQDN_WEB_5173
      - SERVICE_URL_WEB_5173
      - NODE_ENV=production
      - API_PROXY_TARGET=http://api:3100
      # The vite host allowlist needs the bare public hostname.
      - RAKAZO_HOST=${SERVICE_FQDN_WEB}
      - RAKAZO_IMAGE_TAG=${NURLINGS_VERSION:?Set NURLINGS_VERSION to a release tag such as v0.1.0}
      - SCREEN_PROXY_SECRET=${SERVICE_PASSWORD_64_SCREEN}
      - RAKAZO_CSP_SCRIPT_SRC=${RAKAZO_CSP_SCRIPT_SRC:-}
      - RAKAZO_CSP_CONNECT_SRC=${RAKAZO_CSP_CONNECT_SRC:-}
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 2m
      start_interval: 1s

volumes:
  pgdata:
  appdata:

networks:
  app:
  data:
    internal: true
