  KIMI_API_KEY:
  META_API_KEY:
  MINIMAX_API_KEY:
  MINIMAX_CN_API_KEY:
  MISTRAL_API_KEY:
  MOONSHOT_API_KEY:
  NVIDIA_API_KEY:
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENCODE_API_KEY:
