<!doctype html>
<meta charset="utf-8">
<title>Nest phase 2: mood indicator options</title>
<style>
  :root { --background:#fcfcfc; --foreground:#000; --card:#efefef; --muted-foreground:#3c3c43b3; --border:#14141426;
    --destructive:#ce2c31; --success:#007041; --warning:#885a07; --ring-idle:#14141440; }
  :root[data-theme=dark] { --background:#141414; --foreground:#fff; --card:#202020; --muted-foreground:#ebebf599; --border:#fcfcfc24;
    --destructive:#ff9592; --success:#3fa266; --warning:#db941e; --ring-idle:#fcfcfc40; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--background); color:var(--foreground); font:14px/1.4 system-ui,sans-serif; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:28px; }
  h2 { font-size:13px; font-weight:600; margin:0 0 4px; }
  .sub { color:var(--muted-foreground); font-size:12px; margin:0 0 12px; }
  .stack { display:flex; flex-direction:column; gap:10px; }
  .tray { border:1px solid var(--border); border-radius:12px; background:var(--card); padding:12px; margin-bottom:10px; }
  .tray h3 { margin:0 0 8px; font-size:13px; font-weight:500; }
  .tray .row { display:flex; align-items:center; gap:10px; }
  .tray .q { flex:1; min-width:0; }
  .tray .q b { display:block; font-weight:500; }
  .tray .q span { color:var(--muted-foreground); }
  .opts { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .btn { border:1px solid var(--border); border-radius:8px; padding:3px 10px; font-size:13px; background:var(--background); }
  .card { border:1px solid var(--border); border-radius:12px; background:var(--card); padding:14px; display:flex; flex-direction:column; gap:8px; }
  .head { display:flex; align-items:center; gap:12px; }
  .name { font-weight:500; }
  .title { color:var(--muted-foreground); font-size:13px; }
  .line { font-size:13px; } .muted { color:var(--muted-foreground); }
  .stats { color:var(--muted-foreground); font-size:12px; }
  .stats .bad { color:var(--destructive); }
  /* avatar with mood ring */
  .av { position:relative; width:56px; height:56px; border-radius:50%; flex:none; padding:4px; border:3px solid var(--ring-idle); }
  .av svg { width:100%; height:100%; display:block; }
  .av[data-mood=working] { border-color:var(--success); animation:pulse 2s ease-in-out infinite; }
  .av[data-mood=needs_you] { border-color:var(--warning); }
  .av[data-mood=error] { border-color:var(--destructive); }
  .av[data-mood=sleeping] { border-style:dashed; border-color:var(--ring-idle); opacity:.7; }
  @keyframes pulse { 50% { box-shadow:0 0 0 4px color-mix(in srgb, var(--success) 25%, transparent); } }
  .label { font-size:12px; font-weight:500; }
  .label[data-mood=working] { color:var(--success); } .label[data-mood=needs_you] { color:var(--warning); }
  .label[data-mood=error] { color:var(--destructive); } .label[data-mood=idle] { color:var(--foreground); } .label[data-mood=sleeping] { color:var(--muted-foreground); }
  .chip { display:inline-flex; align-items:center; gap:5px; border:1px solid currentColor; border-radius:999px; padding:1px 8px 1px 6px; }
  .chip svg { width:14px; height:10px; }
  .chip[data-mood=sleeping] svg ellipse { transform:scaleY(.2); transform-origin:center; transform-box:fill-box; }
  .chip[data-mood=error] svg { transform:rotate(8deg); }
  .rank { color:var(--muted-foreground); font-size:11px; }
</style>
<body>
<script>
const theme = location.hash.slice(1) || "light";
document.documentElement.dataset.theme = theme;
const blob = (c, eye) => `<svg viewBox="0 0 48 48"><path d="M24 3c12 0 21 8 21 21S36 45 24 45 3 37 3 24 12 3 24 3Z" fill="${c}"/><ellipse cx="17" cy="22" rx="3" ry="5" transform="rotate(-12 17 22)" fill="${eye}"/><ellipse cx="31" cy="22" rx="3" ry="5" transform="rotate(12 31 22)" fill="${eye}"/></svg>`;
const eyes = `<svg viewBox="0 0 20 14"><ellipse cx="5" cy="7" rx="3" ry="5" fill="currentColor" transform="rotate(-12 5 7)"/><ellipse cx="15" cy="7" rx="3" ry="5" fill="currentColor" transform="rotate(12 15 7)"/></svg>`;
const L = { working:"Working", idle:"Idle", sleeping:"Sleeping", needs_you:"Needs you", error:"Error" };
const cards = [
  { n:"Penny", t:"Outreach", c:"#f4a261", mood:"needs_you", line:"Waiting for your answer", stats:"3 done · 2 routine runs · 8.1k tokens" },
  { n:"Scout", t:"Research", c:"#7aa6d6", mood:"error", line:"Last active 8:12 AM · Summarise the competitor pricing pages", stats:`5 done · <span class=bad>2 failed</span> · 1 routine run · 21.4k tokens` },
  { n:"Chief", t:"Chief of staff", c:"#8fbf8f", mood:"working", line:"Drafting the Monday briefing for the leadership team", stats:"4 done · 2 routine runs · 12.4k tokens" },
  { n:"Ledger", t:"Bookkeeping", c:"#c59ad9", mood:"idle", line:"Last active 8:12 AM · Reconcile October invoices", next:"Next: Weekly close · Mon 9:00 AM", stats:"2 done · 1 routine run · 3.2k tokens" },
  { n:"Moss", t:"Gardener", c:"#b9b08a", mood:"sleeping", line:"Last active Tue · Water-schedule reminder", stats:"" },
];
const eye = "#1a1a1a";
function card(x, opt) {
  const label = opt === "A"
    ? `<span class=label data-mood=${x.mood}>${L[x.mood]}</span>`
    : `<span class="label chip" data-mood=${x.mood}>${eyes}${L[x.mood]}</span>`;
  return `<div class=card><div class=head><span class=av data-mood=${x.mood}>${blob(x.c, eye)}</span>
    <span><span class=name>${x.n}</span> <span class=title>${x.t}</span><br>${label}</span></div>
    <div class=line>${x.line}</div>${x.next ? `<div class="line muted">${x.next}</div>` : ""}
    ${x.stats ? `<div class=stats>Today: ${x.stats}</div>` : ""}</div>`;
}
function col(opt, title, sub) {
  return `<div><h2>${title}</h2><p class=sub>${sub}</p>
  <div class=tray><h3>Needs you</h3><div class=row><span class=av style="width:32px;height:32px;padding:2px;border-width:2px" data-mood=needs_you>${blob("#f4a261", eye)}</span>
  <span class=q><b>Penny</b><span>Which tone should the intro email use?</span>
  <div class=opts><span class=btn>Friendly</span><span class=btn>Formal</span><span class=btn>Short</span><span class=btn>Open</span></div></span></div></div>
  <div class=stack>${cards.map(c => card(c, opt)).join("")}</div></div>`;
}
document.body.insertAdjacentHTML("beforeend", `<div class=cols>
${col("A","Option A: ring + text label (eyes dropped) — recommended","Ring color + ring style carry the mood; text names it. Sleeping is dashed, Working pulses.")}
${col("B","Option B: ring + label chip with small eyes","Same ring; the eyes move out of the avatar into the label chip and keep their per-mood look.")}
</div>`);
</script>
